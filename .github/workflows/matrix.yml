name: matrix
on:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10","3.11","3.12"]
    steps:
      - name: matrix-step
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: check version
        run: python3 -c
