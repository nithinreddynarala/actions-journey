name: release
on:
  push:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: lint-step
        run: echo "lint"
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: unit-tests-step
        run: echo "unit-tests"
  package:
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests ]
    steps:
      - name: package-step
        run: echo "package"
