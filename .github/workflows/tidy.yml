name: tidy
on:
  push:
concurrency:
  group: tidy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  count-files:
    name: count-files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: count files
        run: find . -type f | wc -l
