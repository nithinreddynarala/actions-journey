name: reports
on:
  push:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: create an artifact
        run: |
          - echo "Build report" >> report.txt
          - date >> report.txt
      - name: upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt
          retention-days: 5
